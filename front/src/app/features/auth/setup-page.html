<app-auth-frame>
  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div>
      <h1 class="display">Création du compte</h1>
      <p class="intro">Premier lancement : créez l'unique compte d'accès à l'application.</p>
    </div>

    <div class="field">
      <label for="username">Identifiant</label>
      <input id="username" class="input" type="text" autocomplete="username" formControlName="username" />
    </div>

    <div class="field">
      <label for="password">Mot de passe</label>
      <input id="password" class="input" type="password" autocomplete="new-password" formControlName="password" />
    </div>

    <div class="field">
      <label for="passwordConfirmation">Confirmation du mot de passe</label>
      <input
        id="passwordConfirmation"
        class="input"
        type="password"
        autocomplete="new-password"
        formControlName="passwordConfirmation"
      />
    </div>

    <ul class="rules" aria-label="Règles">
      @for (rule of rules(); track rule.label) {
        <li [class.met]="rule.met">
          <app-icon [name]="rule.met ? 'check' : 'close'" [size]="15" />
          <span>{{ rule.label }}</span>
          <span class="visually-hidden">{{ rule.met ? '(respectée)' : '(non respectée)' }}</span>
        </li>
      }
    </ul>

    <div class="form-message" role="status" aria-live="polite">{{ error()?.message }}</div>

    <button type="submit" class="btn btn-primary" [disabled]="submitting()">Créer</button>
  </form>
</app-auth-frame>
